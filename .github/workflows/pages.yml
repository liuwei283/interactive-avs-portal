name: CI and GitHub Pages

# CI runs on every push / pull request.
# DEPLOYMENT IS OPT-IN: the deploy job only runs on `main` when the repository
# variable PAGES_DEPLOY_ENABLED is set to "true" (Settings → Secrets and
# variables → Actions → Variables), or when started manually with
# "Run workflow" and deploy = true.
#
# Deployment publishes the built site to the `gh-pages` branch. In repository
# Settings → Pages set: Source = "Deploy from a branch", Branch = gh-pages, folder = / (root).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages after a successful build
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse protected files in the repository
        run: |
          bad=$(git ls-files | grep -Ei '^private/|\.(pdf|pptx|mp4|webm|wav|mp3|flac)$|(^|/)\.env($|\.)' | grep -v '^\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Protected or large files are tracked in git:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and UI tests
        run: npm test

      - name: Database authorization tests (local Postgres)
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          export PATH="$PGBIN:$PATH"
          bash tests/db/run-db-tests.sh

      - name: Build (GitHub Pages subpath)
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL }}
          VITE_SITE_TITLE: ${{ vars.VITE_SITE_TITLE }}
          VITE_MAX_UPLOAD_MB: ${{ vars.VITE_MAX_UPLOAD_MB }}
          # Optional secret: comma-separated terms that must never appear in the public bundle.
          PROTECTED_PATTERNS: ${{ secrets.PROTECTED_PATTERNS }}
        # `npm run build` = typecheck + vite build + 404.html + bundle security scan
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: site
          path: dist
          include-hidden-files: true # keep dist/.nojekyll
          retention-days: 3

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && vars.PAGES_DEPLOY_ENABLED == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy != 'false')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Push site to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published. Site: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
